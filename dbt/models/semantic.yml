semantic_models:
- name: player_matches
  model: ref('player_matches')
  defaults:
    agg_time_dimension: observed_date
  entities:
  - name: player_match
    type: primary
    expr: match_id || ':' || player_id
  - name: player
    type: foreign
    expr: player_id
  dimensions:
  - name: observed_date
    type: time
    type_params:
      time_granularity: day
  - name: tour
    type: categorical
  - name: surface
    type: categorical
  - name: season
    type: categorical
  - name: level
    type: categorical
  measures:
  - name: match_win_rate_numerator
    agg: sum
    expr: CASE WHEN (won) IS NOT NULL AND (1) IS NOT NULL AND (won)>=0 AND (1)>=0
      AND (won)<=(1) THEN (won) END
  - name: match_win_rate_denominator
    agg: sum
    expr: CASE WHEN (won) IS NOT NULL AND (1) IS NOT NULL AND (won)>=0 AND (1)>=0
      AND (won)<=(1) THEN (1) END
  - name: first_serve_in_numerator
    agg: sum
    expr: CASE WHEN (first_in) IS NOT NULL AND (service_points) IS NOT NULL AND (first_in)>=0
      AND (service_points)>=0 AND (first_in)<=(service_points) THEN (first_in) END
  - name: first_serve_in_denominator
    agg: sum
    expr: CASE WHEN (first_in) IS NOT NULL AND (service_points) IS NOT NULL AND (first_in)>=0
      AND (service_points)>=0 AND (first_in)<=(service_points) THEN (service_points)
      END
  - name: first_serve_won_numerator
    agg: sum
    expr: CASE WHEN (first_won) IS NOT NULL AND (first_in) IS NOT NULL AND (first_won)>=0
      AND (first_in)>=0 AND (first_won)<=(first_in) THEN (first_won) END
  - name: first_serve_won_denominator
    agg: sum
    expr: CASE WHEN (first_won) IS NOT NULL AND (first_in) IS NOT NULL AND (first_won)>=0
      AND (first_in)>=0 AND (first_won)<=(first_in) THEN (first_in) END
  - name: second_serve_won_numerator
    agg: sum
    expr: CASE WHEN (second_won) IS NOT NULL AND (service_points-first_in) IS NOT
      NULL AND (second_won)>=0 AND (service_points-first_in)>=0 AND (second_won)<=(service_points-first_in)
      THEN (second_won) END
  - name: second_serve_won_denominator
    agg: sum
    expr: CASE WHEN (second_won) IS NOT NULL AND (service_points-first_in) IS NOT
      NULL AND (second_won)>=0 AND (service_points-first_in)>=0 AND (second_won)<=(service_points-first_in)
      THEN (service_points-first_in) END
  - name: return_points_won_numerator
    agg: sum
    expr: CASE WHEN (opp_service_points-opp_first_won-opp_second_won) IS NOT NULL
      AND (opp_service_points) IS NOT NULL AND (opp_service_points-opp_first_won-opp_second_won)>=0
      AND (opp_service_points)>=0 AND (opp_service_points-opp_first_won-opp_second_won)<=(opp_service_points)
      THEN (opp_service_points-opp_first_won-opp_second_won) END
  - name: return_points_won_denominator
    agg: sum
    expr: CASE WHEN (opp_service_points-opp_first_won-opp_second_won) IS NOT NULL
      AND (opp_service_points) IS NOT NULL AND (opp_service_points-opp_first_won-opp_second_won)>=0
      AND (opp_service_points)>=0 AND (opp_service_points-opp_first_won-opp_second_won)<=(opp_service_points)
      THEN (opp_service_points) END
  - name: break_point_save_numerator
    agg: sum
    expr: CASE WHEN (bp_saved) IS NOT NULL AND (bp_faced) IS NOT NULL AND (bp_saved)>=0
      AND (bp_faced)>=0 AND (bp_saved)<=(bp_faced) THEN (bp_saved) END
  - name: break_point_save_denominator
    agg: sum
    expr: CASE WHEN (bp_saved) IS NOT NULL AND (bp_faced) IS NOT NULL AND (bp_saved)>=0
      AND (bp_faced)>=0 AND (bp_saved)<=(bp_faced) THEN (bp_faced) END
  - name: break_point_conversion_numerator
    agg: sum
    expr: CASE WHEN (opp_bp_faced-opp_bp_saved) IS NOT NULL AND (opp_bp_faced) IS
      NOT NULL AND (opp_bp_faced-opp_bp_saved)>=0 AND (opp_bp_faced)>=0 AND (opp_bp_faced-opp_bp_saved)<=(opp_bp_faced)
      THEN (opp_bp_faced-opp_bp_saved) END
  - name: break_point_conversion_denominator
    agg: sum
    expr: CASE WHEN (opp_bp_faced-opp_bp_saved) IS NOT NULL AND (opp_bp_faced) IS
      NOT NULL AND (opp_bp_faced-opp_bp_saved)>=0 AND (opp_bp_faced)>=0 AND (opp_bp_faced-opp_bp_saved)<=(opp_bp_faced)
      THEN (opp_bp_faced) END
  - name: aces_per_service_point_numerator
    agg: sum
    expr: CASE WHEN (aces) IS NOT NULL AND (service_points) IS NOT NULL AND (aces)>=0
      AND (service_points)>=0 AND (aces)<=(service_points) THEN (aces) END
  - name: aces_per_service_point_denominator
    agg: sum
    expr: CASE WHEN (aces) IS NOT NULL AND (service_points) IS NOT NULL AND (aces)>=0
      AND (service_points)>=0 AND (aces)<=(service_points) THEN (service_points) END
  - name: double_faults_per_service_point_numerator
    agg: sum
    expr: CASE WHEN (double_faults) IS NOT NULL AND (service_points) IS NOT NULL AND
      (double_faults)>=0 AND (service_points)>=0 AND (double_faults)<=(service_points)
      THEN (double_faults) END
  - name: double_faults_per_service_point_denominator
    agg: sum
    expr: CASE WHEN (double_faults) IS NOT NULL AND (service_points) IS NOT NULL AND
      (double_faults)>=0 AND (service_points)>=0 AND (double_faults)<=(service_points)
      THEN (service_points) END
  - name: average_rally_length_numerator
    agg: sum
    expr: CASE WHEN (rally_shots) IS NOT NULL AND (rally_points) IS NOT NULL AND (rally_shots)>=0
      AND (rally_points)>=0 THEN (rally_shots) END
  - name: average_rally_length_denominator
    agg: sum
    expr: CASE WHEN (rally_shots) IS NOT NULL AND (rally_points) IS NOT NULL AND (rally_shots)>=0
      AND (rally_points)>=0 THEN (rally_points) END
  - name: serve_wide_share_numerator
    agg: sum
    expr: CASE WHEN (serve_wide) IS NOT NULL AND (charted_serves) IS NOT NULL AND
      (serve_wide)>=0 AND (charted_serves)>=0 AND (serve_wide)<=(charted_serves) THEN
      (serve_wide) END
  - name: serve_wide_share_denominator
    agg: sum
    expr: CASE WHEN (serve_wide) IS NOT NULL AND (charted_serves) IS NOT NULL AND
      (serve_wide)>=0 AND (charted_serves)>=0 AND (serve_wide)<=(charted_serves) THEN
      (charted_serves) END
  - name: serve_body_share_numerator
    agg: sum
    expr: CASE WHEN (serve_body) IS NOT NULL AND (charted_serves) IS NOT NULL AND
      (serve_body)>=0 AND (charted_serves)>=0 AND (serve_body)<=(charted_serves) THEN
      (serve_body) END
  - name: serve_body_share_denominator
    agg: sum
    expr: CASE WHEN (serve_body) IS NOT NULL AND (charted_serves) IS NOT NULL AND
      (serve_body)>=0 AND (charted_serves)>=0 AND (serve_body)<=(charted_serves) THEN
      (charted_serves) END
  - name: serve_t_share_numerator
    agg: sum
    expr: CASE WHEN (serve_t) IS NOT NULL AND (charted_serves) IS NOT NULL AND (serve_t)>=0
      AND (charted_serves)>=0 AND (serve_t)<=(charted_serves) THEN (serve_t) END
  - name: serve_t_share_denominator
    agg: sum
    expr: CASE WHEN (serve_t) IS NOT NULL AND (charted_serves) IS NOT NULL AND (serve_t)>=0
      AND (charted_serves)>=0 AND (serve_t)<=(charted_serves) THEN (charted_serves)
      END
  - name: charted_match_coverage_numerator
    agg: sum
    expr: CASE WHEN (charted_match) IS NOT NULL AND (1) IS NOT NULL AND (charted_match)>=0
      AND (1)>=0 AND (charted_match)<=(1) THEN (charted_match) END
  - name: charted_match_coverage_denominator
    agg: sum
    expr: CASE WHEN (charted_match) IS NOT NULL AND (1) IS NOT NULL AND (charted_match)>=0
      AND (1)>=0 AND (charted_match)<=(1) THEN (1) END
  - name: odds_match_coverage_numerator
    agg: sum
    expr: CASE WHEN (odds_match) IS NOT NULL AND (1) IS NOT NULL AND (odds_match)>=0
      AND (1)>=0 AND (odds_match)<=(1) THEN (odds_match) END
  - name: odds_match_coverage_denominator
    agg: sum
    expr: CASE WHEN (odds_match) IS NOT NULL AND (1) IS NOT NULL AND (odds_match)>=0
      AND (1)>=0 AND (odds_match)<=(1) THEN (1) END
  - name: venue_coverage_numerator
    agg: sum
    expr: CASE WHEN (venue_verified) IS NOT NULL AND (1) IS NOT NULL AND (venue_verified)>=0
      AND (1)>=0 AND (venue_verified)<=(1) THEN (venue_verified) END
  - name: venue_coverage_denominator
    agg: sum
    expr: CASE WHEN (venue_verified) IS NOT NULL AND (1) IS NOT NULL AND (venue_verified)>=0
      AND (1)>=0 AND (venue_verified)<=(1) THEN (1) END
  - name: weather_coverage_numerator
    agg: sum
    expr: CASE WHEN (weather_available) IS NOT NULL AND (1) IS NOT NULL AND (weather_available)>=0
      AND (1)>=0 AND (weather_available)<=(1) THEN (weather_available) END
  - name: weather_coverage_denominator
    agg: sum
    expr: CASE WHEN (weather_available) IS NOT NULL AND (1) IS NOT NULL AND (weather_available)>=0
      AND (1)>=0 AND (weather_available)<=(1) THEN (1) END
