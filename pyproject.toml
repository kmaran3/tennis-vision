[project]
name = "baseline-tennis"
version = "0.1.0"
description = "Historical ATP/WTA analysis with governed metrics"
requires-python = ">=3.11,<3.12"
dependencies = [
 "duckdb>=1.3,<2", "dbt-core>=1.10,<1.13", "dbt-duckdb>=1.9,<2",
 "dbt-metricflow>=0.10,<0.13", "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
 "pydantic>=2.10,<3", "httpx>=0.28,<1", "itsdangerous>=2.2,<3",
 "scikit-learn>=1.6,<2", "xgboost>=3,<4", "pandas>=2.2,<3",
 "langgraph>=1,<2", "google-genai>=1.50,<2", "pyyaml>=6,<7"
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]
[project.scripts]
baseline = "baseline.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.wheel]
packages = ["baseline"]
